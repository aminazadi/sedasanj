; BEGIN recuploader mixmon globals - managed by the Recording Uploader module, do not edit by hand
SS=$
MIXMON_DIR=/var/spool/asterisk/monitor/
MONITOR_REC_OPTION=br(${SS}{MIXMON_DIR}${SS}{YEAR}/${SS}{MONTH}/${SS}{DAY}/recv_${SS}{CALLFILENAME}.${SS}{MON_FMT})t(${SS}{MIXMON_DIR}${SS}{YEAR}/${SS}{MONTH}/${SS}{DAY}/trans_${SS}{CALLFILENAME}.${SS}{MON_FMT})
; Every caller-controlled value is passed through FILTER() before it reaches the shell:
; SIP user parts and dialed digits may legally contain $ ( ) ` " ; and would otherwise
; be expanded by /bin/sh (command injection as the asterisk user). The allowed set has
; no shell metacharacters; the hyphen is last so it is a literal. Verify on a lab PBX.
MIXMON_POST=/bin/bash -c 'exec "$(command -v php)" /usr/local/bin/asterisk-recording-uploader/bin/mix-stereo.php "$@"' _ "${SS}{MIXMON_DIR}${SS}{YEAR}/${SS}{MONTH}/${SS}{DAY}/" "${SS}{FILTER(0-9A-Za-z*#+_.-,${SS}{CALLFILENAME})}" "${SS}{FILTER(0-9.,${SS}{UNIQUEID})}" "${SS}{FILTER(0-9A-Za-z*#+_.-,${SS}{CALLERID(num)})}" "${SS}{FILTER(0-9A-Za-z*#+_.-,${SS}{CDR(dnid)})}" "${SS}{FILTER(0-9.,${SS}{CDR(duration)})}" "${SS}{FILTER(0-9A-Za-z*#+_.-,${SS}{CDR(dst)})}" "${SS}{FILTER(0-9A-Za-z*#+_.-,${SS}{FROM_DID})}"
; END recuploader mixmon globals
