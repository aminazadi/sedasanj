services:
  persian-asr:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirror.novin.cloud/artifactory/api/pypi/pypi/simple/}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-600}
        APT_UBUNTU_MIRRORS: ${APT_UBUNTU_MIRRORS:-https://mirror.arvancloud.ir/ubuntu/ https://mirrors.ustc.edu.cn/ubuntu/ https://mirrors.tuna.tsinghua.edu.cn/ubuntu/}
    image: persian-asr:gpu
    environment:
      ASR_GPU_MODE: ${ASR_GPU_MODE:-auto}
      ASR_GPU_MAX_CONCURRENT: ${ASR_GPU_MAX_CONCURRENT:-1}
      ASR_GPU_MIN_FREE_MB: ${ASR_GPU_MIN_FREE_MB:-1024}
      ASR_GPU_CPU_FALLBACK_SECONDS: ${ASR_GPU_CPU_FALLBACK_SECONDS:-30}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
