[project]
name = "cbi-voice-analytics"
version = "0.1.0"
description = "Persian post-call voice analytics platform (ASR + LLM), multi-tenant SaaS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "arq>=0.26.0",
    "redis>=5.0.7",
    "aioboto3>=13.1.0",
    "prometheus-client>=0.20.0",
    "email-validator>=2.2.0",
    "tomli-w>=1.0.0",
    "pyzipper==0.3.6",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
emotion = [
    "funasr==1.4.16",
    "torch==2.14.0",
]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-aioboto3",
]

[project.scripts]
cbi-agent = "cbi_agent.main:main"

[build-system]
requires = ["hatchling==1.27.0", "pluggy==1.5.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/app",
    "apps/worker_asr/worker_asr",
    "apps/worker_llm/worker_llm",
    "apps/worker_notify/worker_notify",
    "apps/worker_dispatch/worker_dispatch",
    "apps/worker_emotion/worker_emotion",
    "apps/worker_provision/worker_provision",
    "apps/agent/cbi_agent",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api", "apps/worker_asr", "apps/worker_emotion", "apps/worker_llm", "apps/worker_notify", "apps/worker_provision", "apps/agent"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
# Local scratch/spool files are small and on fast local disk; a thread hop buys nothing.
ignore = ["ASYNC230", "ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker_asr", "worker_emotion", "worker_llm", "worker_notify", "worker_provision", "cbi_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = []
mypy_path = "apps/api:apps/worker_asr:apps/worker_emotion:apps/worker_llm:apps/worker_notify:apps/worker_provision:apps/worker_dispatch:apps/agent"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["arq.*", "aioboto3.*", "onnxruntime.*", "asterisk.*", "funasr.*", "torch.*", "pyzipper.*", "cryptography.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "apps/api",
    "apps/worker_asr",
    "apps/worker_emotion",
    "apps/worker_llm",
    "apps/worker_notify",
    "apps/worker_provision",
    "apps/worker_dispatch",
    "apps/agent",
]
filterwarnings = ["ignore::DeprecationWarning"]
