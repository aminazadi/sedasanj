# Local infra only (Postgres, Redis, MinIO). App processes stay on the host.
# Ports and credentials match the development .env used on a laptop
# (5433 / 6380 / 9000 — host 5432 and 6379 are often already taken).
name: cbi-local

services:
  postgres:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.postgres.local
      args:
        AGE_COMMIT: ${AGE_COMMIT:-2db2f060c4c9265a14d40f007eb8c56febf31e4c}
    restart: unless-stopped
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cbi
      # Used by deploy/postgres/init/10-app-role.sh (migrations GRANT to this role).
      APP_DB_PASSWORD: cbi_app
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d cbi && psql -U root -d cbi -tAc \"SELECT count(*) = 2 FROM pg_available_extensions WHERE name IN ('vector','age')\" | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6380:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: minio123
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
