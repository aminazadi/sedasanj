groups:
  - name: cbi-platform
    rules:
      - alert: LlamaServerDown
        # llm1/llm2 only run with the local-llm profile; absent targets must not page anyone.
        expr: up{job="llama"} == 0 and on() (count(up{job="llama"}) > 0) and on() (max(up{job="llama"}) == 1)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "llama-server {{ $labels.instance }} is down"

      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "api instance {{ $labels.instance }} is down"

      - alert: DispatcherDown
        expr: up{job="dispatcher"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "durable outbox dispatcher is down"

      - alert: PostgresUnreachable
        expr: increase(cbi_http_requests_total{status="503"}[5m]) > 10
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "readiness failing; check postgres/redis/minio"

      - alert: RetryableBacklog
        expr: sum(cbi_queue_depth) > 50
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "queue backlog above 50 for 10 minutes"

      - alert: FailedRetryableBacklog
        expr: sum(cbi_jobs_failed_retryable) > 20
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "more than 20 jobs waiting for a retry"

      - alert: DiskSpaceLow
        expr: |
          min by (instance) (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ) < 0.15
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "less than 15% disk free on {{ $labels.instance }}"

      - alert: LlmJsonFailures
        expr: increase(cbi_llm_json_failures_total[15m]) > 20
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "LLM JSON parse failures rising"

      - alert: LlmSubmissionDelayed
        expr: histogram_quantile(0.95, sum(rate(cbi_llm_submit_seconds_bucket[10m])) by (le)) > 30
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p95 ASR-to-provider submission latency is above 30 seconds"

      - alert: OldestLlmJobDelayed
        expr: cbi_oldest_job_seconds{kind="llm"} > 60
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "oldest queued LLM job is above 60 seconds"

      - alert: DurableOutboxDelayed
        expr: cbi_outbox_pending > 0 and cbi_outbox_oldest_seconds > 30
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "durable job dispatch is delayed"

      - alert: ScheduledReportFailures
        expr: increase(cbi_scheduled_report_final_failures_total[15m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "a scheduled report exhausted its retry policy"

      - alert: ScheduledReportWorkerRecovery
        expr: increase(cbi_scheduled_report_stuck_total[15m]) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "a scheduled report worker exceeded its processing deadline"

      - alert: LlmProviderFailures
        expr: cbi_provider_tasks{status="failed"} > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "multiple provider analysis steps have failed"

  - name: cbi-workers-and-module
    rules:
      - alert: WorkerDown
        expr: up{job="workers"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "worker {{ $labels.instance }} is down"
          description: "worker-notify also runs the reconciler, retention, renewals and expiry; worker-asr/llm/emotion stop analysing calls."

      - alert: ProvisionWorkerDown
        expr: up{job="provision"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "worker-provision is down (tenant databases, backups and projections stop)"

      - alert: ApiServerErrors
        expr: |
          sum(rate(cbi_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(cbi_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "more than 5% of API requests fail with 5xx"

      - alert: IngestRejectedSpike
        expr: sum(increase(cbi_ingest_total{result=~"storage_error|metadata_error"}[15m])) > 5
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "recordings are being rejected by the ingest API (storage or metadata errors)"
          description: "FreePBX hosts keep their recordings and retry, but check MinIO/Postgres now."

      - alert: IngestCreditRejects
        expr: sum(increase(cbi_credit_rejects_total[1h])) > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "many uploads rejected for insufficient credit"

      - alert: WebhookFailures
        expr: |
          sum(increase(cbi_webhook_responses_total{status!~"2.."}[15m]))
            / clamp_min(sum(increase(cbi_webhook_responses_total[15m])), 1) > 0.5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "more than half of the webhook deliveries fail"

      - alert: OldestAsrJobDelayed
        expr: cbi_oldest_job_seconds{kind="asr"} > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "oldest queued ASR job is older than 15 minutes"

      - alert: OldestNotifyJobDelayed
        expr: cbi_oldest_job_seconds{kind="notify"} > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "oldest queued notify job is older than 15 minutes"
