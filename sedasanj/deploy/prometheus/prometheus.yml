global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization:
      credentials_file: /prometheus/metrics_token
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000

  - job_name: workers
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker-asr", "worker-emotion", "worker-llm", "worker-notify"]
        type: A
        port: 9100

  - job_name: dispatcher
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker-dispatch"]
        type: A
        port: 9100

  - job_name: llama
    static_configs:
      - targets: ["llm1:8081", "llm2:8081"]
    metrics_path: /metrics

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
