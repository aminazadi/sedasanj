name: Jalase-Negar Windows

# Windows cannot be built on macOS, so the Windows release is built here.
# Run it by hand (Actions > Jalase-Negar Windows > Run workflow) or push a tag like jalase-negar-v1.1.2.
on:
  workflow_dispatch:
  push:
    tags: ["jalase-negar-v*"]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: jalase-negar
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release --dart-define=STORE=desktop
      - name: Zip the portable build
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "JalaseNegar-windows-v$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: jalase-negar-windows
          path: jalase-negar/JalaseNegar-windows-v*.zip
          if-no-files-found: error
