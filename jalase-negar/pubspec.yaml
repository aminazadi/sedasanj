name: jalase_negar
description: "ضبط جلسه و رونویسی لوکال فارسی؛ تحلیل و صورت‌جلسه توسط صداسنج"
publish_to: 'none'

version: 1.1.2+10

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  record: ^6.2.1
  sherpa_onnx: ^1.13.6
  dio: ^5.11.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  uuid: ^4.6.0
  shamsi_date: ^1.1.1
  share_plus: ^12.0.2
  wakelock_plus: ^1.2.10
  url_launcher: ^6.2.0
  url_launcher_android: 6.3.23
  flutter_secure_storage: ^10.3.4
  mobile_scanner: ^7.4.3
  file_picker: ^11.0.3
  connectivity_plus: ^7.3.1
  flutter_foreground_task: ^10.0.0
  disk_space_plus: ^0.2.6
  crypto: ^3.0.8
  flutter_svg: ^2.3.0
  package_info_plus: ^9.0.1
  just_audio: ^0.10.6
  cryptography: ^2.9.0
  sqflite_common_ffi_web: ^1.1.1
  sqflite_common_ffi: ^2.4.0+3
  just_audio_windows: ^0.2.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/brand/
    - assets/speaker_prompts_fa.json
    - assets/audio/countdown-beep.wav
    - assets/audio/countdown-final.wav

  fonts:
    - family: Vazirmatn
      fonts:
        # Static instances of the SedaSanj variable font (wght 350 / 500 / 600)
        - asset: assets/fonts/Vazirmatn-SSText.ttf
        - asset: assets/fonts/Vazirmatn-SSMedium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SSStrong.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-SSStrong.ttf
          weight: 700
